<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能客服 · AI Customer Service</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  .sidebar {
    width: 268px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; border-bottom: 1px solid var(--border);
  }
  .brand-logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #2f5fe0, #5b8def);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .brand-text b { display: block; font-size: 14px; }
  .brand-text span { font-size: 11px; color: var(--text-soft); }

  .side-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .side-label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--text-soft); text-transform: uppercase; margin-bottom: 8px;
  }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    background: var(--panel-alt); border: 1px solid var(--border);
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px; flex-shrink: 0;
  }
  .user-card .u-name { font-size: 13px; font-weight: 600; }
  .user-card .u-meta { font-size: 11px; color: var(--text-muted); }

  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conv-item {
    padding: 9px 10px; border-radius: var(--radius-sm);
    border: 1px solid transparent; cursor: pointer; margin-bottom: 3px;
    transition: background .12s, border-color .12s;
  }
  .conv-item:hover { background: var(--panel-alt); }
  .conv-item.active { background: var(--primary-soft); border-color: #c9d8ff; }
  .conv-item .c-title {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-item .c-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 3px; font-size: 11px; color: var(--text-soft);
  }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 22px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .chat-head .t { font-size: 15px; font-weight: 600; }
  .chat-head .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .chat-head-right { display: flex; align-items: center; gap: 8px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 22px 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 10px; max-width: 780px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .msg.assistant .msg-avatar { background: var(--primary-soft); color: var(--primary-dark); }
  .msg.user .msg-avatar { background: #e8ecf3; color: #475467; }
  .msg.agent .msg-avatar { background: var(--success-soft); color: #0b7a3d; }

  .msg-stack { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .msg.user .msg-stack { align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }
  .msg.agent .bubble { background: var(--success-soft); border-color: #bfe8d1; }
  .msg-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-soft);
  }
  .msg.user .msg-meta { justify-content: flex-end; }
  .source-list { display: flex; flex-wrap: wrap; gap: 6px; }

  .handoff-banner {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px; border-radius: var(--radius-sm);
    background: var(--warning-soft); border: 1px solid #f5d9a8;
    font-size: 12.5px; color: #8a4d05; max-width: 780px;
  }

  .composer { padding: 14px 22px 18px; background: var(--panel); border-top: 1px solid var(--border); }
  .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .suggestion {
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--border-strong); background: var(--panel);
    color: var(--text-muted); transition: all .13s;
  }
  .suggestion:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  .composer-row { display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 150px;
    padding: 11px 13px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); outline: none; line-height: 1.5;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,95,224,.12); }
  .composer-hint { font-size: 11px; color: var(--text-soft); margin-top: 7px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 3px 0; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-soft);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .28; } 30% { opacity: 1; } }

  .rating-box {
    display: flex; flex-direction: column; gap: 9px;
    padding: 13px 15px; border-radius: var(--radius-sm);
    background: var(--panel-alt); border: 1px dashed var(--border-strong);
    max-width: 780px;
  }
  .rating-stars { display: flex; gap: 5px; }
  .star {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel); font-size: 14px; color: var(--text-soft);
    display: flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .star:hover, .star.on { background: #fff5e0; border-color: #f0b429; color: #d97706; }
  .rating-note { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="shell">
  <!-- ---------------- sidebar ---------------- -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">CS</div>
      <div class="brand-text">
        <b>智能客服中心</b>
        <span id="brand-engine">AI Customer Service</span>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">当前用户</div>
      <div class="user-card">
        <div class="avatar" id="user-avatar">U1</div>
        <div style="min-width:0">
          <div class="u-name" id="user-name">user001</div>
          <div class="u-meta" id="user-meta">STANDARD · 加载中…</div>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:9px" id="btn-new">＋ 新建会话</button>
    </div>

    <div class="side-section" style="padding-bottom:8px">
      <div class="side-label" style="margin-bottom:0">历史会话</div>
    </div>
    <div class="conv-list" id="conv-list">
      <div class="empty-state" style="padding:24px 10px;font-size:12px">暂无历史会话</div>
    </div>

    <div class="side-section" style="border-bottom:none;border-top:1px solid var(--border)">
      <a class="btn btn-ghost btn-sm" href="/admin" target="_blank" style="width:100%">管理后台 →</a>
    </div>
  </aside>

  <!-- ---------------- chat ---------------- -->
  <main class="chat-main">
    <div class="chat-head">
      <div style="min-width:0">
        <div class="t" id="chat-title">在线客服</div>
        <div class="s" id="chat-sub">多轮上下文 · FAQ 知识库 · 意图识别 · 转人工</div>
      </div>
      <div class="chat-head-right">
        <span class="badge badge-neutral" id="head-intent">等待提问</span>
        <span class="badge badge-neutral" id="head-status">进行中</span>
        <button class="btn btn-sm" id="btn-handoff">转人工</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="suggestions" id="suggestions"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="请输入您的问题，例如：帮我查一下订单 ORD-1001 的物流"></textarea>
        <button class="btn btn-primary" id="btn-send" style="height:44px;padding:0 22px">发送</button>
      </div>
      <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 输入「转人工」可随时转接人工客服</div>
    </div>
  </main>
</div>

<div id="toast-host"></div>
<script src="/static/app.js"></script>
</body>
</html>
