name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile all sources
        run: python -m compileall -q app scripts tests

      - name: Run tests
        run: python -m pytest

  frontend:
    name: frontend consistency check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pages are build-free, so a typo in an element id would only show up
      # as a runtime crash in the browser. This catches it statically.
      - name: Check element ids and asset references
        run: node scripts/check_frontend.mjs

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Seed demo data
        run: python scripts/seed.py --reset --with-demo-chats 6

      - name: Start server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/healthz > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server failed to start"; exit 1

      - name: Run smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000
